<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saans · Living city</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root { --panel: rgba(16,18,24,.78); --line: rgba(255,255,255,.14); --ink: #f0efec; --ink2: #c3c2b7; --muted: #9a9890; --accent: #3987e5;
  --font: "Noto Sans", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1226; color: var(--ink); font: 14px/1.45 var(--font); }
canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.panel { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; backdrop-filter: blur(8px); }
#top { top: 12px; left: 12px; display: flex; align-items: center; gap: 12px; padding: 8px 12px; }
#top a { color: var(--ink2); text-decoration: none; font-size: 13px; }
#top b { font-size: 17px; letter-spacing: -.01em; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--ink2); font: inherit; font-size: 12.5px; padding: 4px 10px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #101218; }
#stats { top: 12px; right: 12px; width: 250px; }
#stats .lab { font-size: 12px; color: var(--ink2); }
#stats .big { font-size: 44px; font-weight: 700; line-height: 1; margin: 4px 0 4px; letter-spacing: -.02em; }
#stats .big small { font-size: 14px; font-weight: 500; color: var(--ink2); letter-spacing: 0; }
.badge { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 13px; }
.badge i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.row { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; padding: 5px 0; border-top: 1px solid var(--line); margin-top: 6px; }
.row span { color: var(--ink2); } .row b { font-weight: 600; }
#arrow { display: inline-block; transition: transform .3s; }
#side { left: 12px; top: 70px; width: 215px; display: grid; gap: 8px; }
#side .lab { font-size: 12px; color: var(--ink2); }
#side label { display: flex; align-items: center; gap: 7px; font-size: 13px; cursor: pointer; }
#side input { accent-color: var(--accent); }
.btn { border: 1px solid var(--line); background: rgba(255,255,255,.06); color: var(--ink); font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 999px; cursor: pointer; }
.btn.on { background: var(--accent); border-color: transparent; color: #fff; }
#bottom { left: 12px; right: 12px; bottom: 12px; display: grid; gap: 8px; }
#timeRow { display: flex; align-items: center; gap: 12px; }
#timeRow input { flex: 1; accent-color: var(--accent); }
#clock { font-weight: 600; min-width: 170px; }
#story { color: var(--ink2); font-size: 13.5px; min-height: 20px; }
#legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; font-size: 12px; color: var(--ink2); }
#grad { display: grid; gap: 2px; min-width: 260px; flex: 1 1 260px; max-width: 420px; }
#grad .bar { height: 8px; border-radius: 4px; }
#grad .ticks { display: flex; justify-content: space-between; }
.lbl { position: fixed; transform: translate(-50%, -100%); pointer-events: none; font-size: 12px; font-weight: 600; white-space: nowrap;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 2px 8px; }
.lbl small { font-weight: 500; color: var(--ink2); }
.lbl.dump { font-weight: 500; color: var(--ink2); font-size: 11px; }
#tip { position: fixed; pointer-events: none; display: none; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12.5px; min-width: 170px; z-index: 5; }
#tip .t { font-weight: 600; margin-bottom: 3px; } #tip div span { color: var(--ink2); }
#fail { position: fixed; inset: 0; display: none; place-items: center; text-align: center; padding: 24px; }
#bottom { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 760px) {
  #side { display: none; }
  #top { right: 12px; flex-wrap: wrap; gap: 8px; padding: 6px 10px; }
  #top [data-i="title"] { display: none; }
  #stats { top: 62px; right: 12px; left: auto; width: 168px; padding: 8px 10px; }
  #stats .big { font-size: 28px; } #stats .row { font-size: 12px; padding: 3px 0; margin-top: 3px; }
  #timeRow { flex-wrap: wrap; gap: 6px 10px; } #timeRow input { flex: 1 1 180px; } #clock { min-width: 0; font-size: 13px; }
  #grad { min-width: 0; flex-basis: 100%; } #grad .ticks { font-size: 9.5px; }
  #legend { font-size: 11px; } #story { font-size: 12.5px; }
  .lbl { font-size: 10.5px; padding: 1px 6px; }
}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="labels"></div>
<div class="panel" id="top">
  <b>Saans</b> <span data-i="title">Living city</span>
  <a href="index.html" data-i="back">← Map &amp; details</a>
  <div class="seg" role="group" aria-label="Language"><button data-lang="en">EN</button><button data-lang="hi">हिंदी</button><button data-lang="mr">मराठी</button></div>
</div>
<div class="panel" id="stats">
  <div class="lab" data-i="cityNow">City average PM2.5</div>
  <div class="big"><span id="pmNow"></span> <small>µg/m³</small></div>
  <div class="badge" id="band"></div>
  <div class="row"><span data-i="wind">Wind</span><b><span id="arrow">↑</span> <span id="windTxt"></span></b></div>
  <div class="row"><span data-i="lid">Mixing height</span><b id="lidTxt"></b></div>
</div>
<div class="panel" id="side">
  <div class="lab" data-i="height">Show the city as</div>
  <div class="seg" role="group" id="metric" style="flex-wrap:wrap;border-radius:12px"><button data-m="bld" data-i="mBld">Buildings</button><button data-m="pop" data-i="mPop">People</button><button data-m="kids" data-i="mKids">Children</button><button data-m="eld" data-i="mEld">65+</button></div>
  <label><input type="checkbox" id="cWind" checked> <span data-i="lWind">Wind &amp; haze</span></label>
  <label><input type="checkbox" id="cLid" checked> <span data-i="lLid">Mixing-height lid</span></label>
  <label><input type="checkbox" id="cParks" checked> <span data-i="lParks">Parks</span></label>
  <label><input type="checkbox" id="cDump" checked> <span data-i="lDump">Dumping grounds</span></label>
  <button class="btn on" id="tour" data-i="tour">Auto tour</button>
</div>
<div class="panel" id="bottom">
  <div id="story" aria-live="polite"></div>
  <div id="timeRow"><button class="btn" id="play" aria-label="Play or pause">❚❚</button><input type="range" id="time" min="0" step="1" aria-label="Forecast hour"><div id="clock"></div></div>
  <div id="legend"><div id="grad"><div class="bar"></div><div class="ticks"></div></div><span id="legTxt"></span></div>
</div>
<div id="tip"></div>
<div id="fail"><div><h2>3D view needs WebGL</h2><p><a href="index.html" style="color:#8ab4f8">Open the map version instead</a></p></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="data.js"></script>
<script src="buildings.js"></script>
<script>
(() => {
window.onerror = (m) => { document.title = 'ERR ' + m; };
const S = window.SAANS, $ = s => document.querySelector(s);
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const VEX = 2.5;   // vertical exaggeration of real building heights
const T = {
 en: { title: 'Living city', back: '← Map & details', cityNow: 'City average PM2.5', wind: 'Wind', lid: 'Mixing height', height: 'Show the city as', mBld: 'Buildings', legB: n => `${n} real buildings with their heights (3D-GloBFP, drawn ${VEX}× taller). Ground and haze colour = forecast PM2.5. Dark green discs = parks.`,
  mPop: 'People', mKids: 'Children', mEld: '65+', lWind: 'Wind & haze', lLid: 'Mixing-height lid', lParks: 'Parks', lDump: 'Dumping grounds', tour: 'Auto tour',
  legH: 'Each tower is a 1 km square. Height = people living there. Colour = forecast PM2.5.',
  q: ['Good', 'Satisfactory', 'Moderate', 'Poor', 'Very poor', 'Severe'], from: 'from', people: 'People', kids: 'Children under 5', eld: 'Adults 65+', park: 'Park', miyawaki: 'Miyawaki garden', zoo: 'Zoo',
  dirs: ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'],
  s1: m => `Mixing height is only ${m} m, so pollution is trapped near the ground.`, s2: m => `Mixing height is ${m} m: the air is mixing, and pollution is thinning out.`,
  s3: m => `Mixing height is ${m} m: the lid is lifting and the air can clear.`, calm: 'Winds are light, so smoke stays where it is made.' },
 hi: { title: 'जीवंत शहर', back: '← नक्शा और विवरण', cityNow: 'शहर का औसत PM2.5', wind: 'हवा', lid: 'मिश्रण ऊँचाई', height: 'शहर ऐसे दिखाएँ', mBld: 'इमारतें', legB: n => `${n} असली इमारतें अपनी ऊँचाई के साथ (3D-GloBFP, ${VEX}× ऊँची दिखाई गईं)। ज़मीन और धुंध का रंग = PM2.5 पूर्वानुमान। गहरे हरे गोले = उद्यान।`,
  mPop: 'लोग', mKids: 'बच्चे', mEld: '65+', lWind: 'हवा और धुंध', lLid: 'मिश्रण-ऊँचाई की परत', lParks: 'उद्यान', lDump: 'डंपिंग मैदान', tour: 'स्वचालित सैर',
  legH: 'हर टावर 1 किमी का वर्ग है। ऊँचाई = वहाँ रहने वाले लोग। रंग = PM2.5 पूर्वानुमान।',
  q: ['अच्छा', 'संतोषजनक', 'मध्यम', 'खराब', 'बहुत खराब', 'गंभीर'], from: 'से', people: 'लोग', kids: '5 साल से छोटे बच्चे', eld: '65+ उम्र के लोग', park: 'उद्यान', miyawaki: 'मियावाकी वन', zoo: 'चिड़ियाघर',
  dirs: ['उत्तर', 'उत्तर-पूर्व', 'पूर्व', 'दक्षिण-पूर्व', 'दक्षिण', 'दक्षिण-पश्चिम', 'पश्चिम', 'उत्तर-पश्चिम'],
  s1: m => `मिश्रण ऊँचाई सिर्फ़ ${m} मी है, इसलिए प्रदूषण ज़मीन के पास फँसा है।`, s2: m => `मिश्रण ऊँचाई ${m} मी है: हवा घुल रही है और प्रदूषण पतला हो रहा है।`,
  s3: m => `मिश्रण ऊँचाई ${m} मी है: परत उठ रही है और हवा साफ़ हो सकती है।`, calm: 'हवा धीमी है, इसलिए धुआँ वहीं रुका रहता है।' },
 mr: { title: 'जिवंत शहर', back: '← नकाशा आणि तपशील', cityNow: 'शहराची सरासरी PM2.5', wind: 'वारा', lid: 'मिश्रण उंची', height: 'शहर असे दाखवा', mBld: 'इमारती', legB: n => `${n} खऱ्या इमारती त्यांच्या उंचीसह (3D-GloBFP, ${VEX}× उंच दाखवल्या). जमीन आणि धुक्याचा रंग = PM2.5 अंदाज. गडद हिरवे ठिपके = उद्याने.`,
  mPop: 'लोक', mKids: 'मुले', mEld: '65+', lWind: 'वारा आणि धुके', lLid: 'मिश्रण-उंचीचा थर', lParks: 'उद्याने', lDump: 'कचराभूमी', tour: 'स्वयंचलित फेरी',
  legH: 'प्रत्येक मनोरा 1 किमीचा चौरस आहे. उंची = तिथे राहणारे लोक. रंग = PM2.5 अंदाज.',
  q: ['चांगली', 'समाधानकारक', 'मध्यम', 'वाईट', 'खूप वाईट', 'गंभीर'], from: 'कडून', people: 'लोक', kids: '5 वर्षांखालील मुले', eld: '65+ वयाचे लोक', park: 'उद्यान', miyawaki: 'मियावाकी वन', zoo: 'प्राणिसंग्रहालय',
  dirs: ['उत्तर', 'ईशान्य', 'पूर्व', 'आग्नेय', 'दक्षिण', 'नैऋत्य', 'पश्चिम', 'वायव्य'],
  s1: m => `मिश्रण उंची फक्त ${m} मी आहे, त्यामुळे प्रदूषण जमिनीजवळ अडकले आहे.`, s2: m => `मिश्रण उंची ${m} मी आहे: हवा मिसळत आहे आणि प्रदूषण विरळ होत आहे.`,
  s3: m => `मिश्रण उंची ${m} मी आहे: थर वर जात आहे आणि हवा स्वच्छ होऊ शकते.`, calm: 'वारा मंद आहे, त्यामुळे धूर जागेवरच राहतो.' },
};
const LOC = { en: 'en-IN', hi: 'hi-IN', mr: 'mr-IN' };
const QP = new URLSearchParams(location.search);
let lang = T[QP.get('lang')] ? QP.get('lang') : (T[store.get('saans-lang')] ? store.get('saans-lang') : 'en');
const t = k => T[lang][k];
const num = v => Math.round(v).toLocaleString(LOC[lang]);

if (!S || !S.pop || !window.THREE) { $('#fail').style.display = 'grid'; return; }
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas: $('#gl'), antialias: true }); } catch (e) { $('#fail').style.display = 'grid'; return; }
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));

/* ---------- data ---------- */
const ST = S.stations, IDS = ST.map(s => String(s.id)), NH = S.forecast.hours.length;
const FV = IDS.map(id => S.forecast.values[id]);
const HOURS = S.forecast.hours.map(h => new Date(h + ':00+05:30'));
const U = [], V = [], BLH = IDS.map(id => S.met.blh[id]);
IDS.forEach((id, k) => { U[k] = []; V[k] = []; S.met.ws[id].forEach((w, i) => { const d = S.met.wd[id][i] * Math.PI / 180; U[k][i] = -w * Math.sin(d); V[k][i] = -w * Math.cos(d); }); });
const LAT0 = 19.085, LON0 = 72.885, KX = 111.32 * Math.cos(LAT0 * Math.PI / 180), KZ = 110.6;
const PX = lon => (lon - LON0) * KX, PZ = lat => -(lat - LAT0) * KZ;
const SP = ST.map(s => [PX(s.lon), PZ(s.lat)]);
const wts = (x, z) => { const w = SP.map(p => 1 / Math.max(0.25, (x - p[0]) ** 2 + (z - p[1]) ** 2)); const s = w[0] + w[1] + w[2] + w[3]; return w.map(v => v / s); };
const at = (arr, th) => { const i = Math.min(NH - 1, Math.floor(th)), j = Math.min(NH - 1, i + 1), f = th - i; return arr[i] * (1 - f) + arr[j] * f; };
const P = S.pop, NC = P.lat.length, CX = P.lon.map(PX), CZ = P.lat.map(PZ), CW = CX.map((x, i) => wts(x, CZ[i]));
const pinName = Object.fromEntries(S.pincodes.features.map(f => [f.properties.pincode, f.properties.name]));
const QB = [30, 60, 90, 120, 250], QC = ['#2e9e44', '#8fbf3a', '#e3b916', '#ef8a24', '#d6392e', '#8e1b2b'];
const ANCH = [[15, QC[0]], [45, QC[1]], [75, QC[2]], [105, QC[3]], [185, QC[4]], [300, QC[5]]].map(([v, c]) => [v, new THREE.Color(c)]);
const qIdx = v => { const i = QB.findIndex(b => v <= b); return i < 0 ? 5 : i; };
const tmpC = new THREE.Color();
function pmColor(v, out) { out = out || tmpC;
  if (v <= ANCH[0][0]) return out.copy(ANCH[0][1]);
  for (let i = 1; i < ANCH.length; i++) if (v <= ANCH[i][0]) return out.copy(ANCH[i - 1][1]).lerp(ANCH[i][1], (v - ANCH[i - 1][0]) / (ANCH[i][0] - ANCH[i - 1][0]));
  return out.copy(ANCH[5][1]); }

/* ---------- scene ---------- */
const scene = new THREE.Scene(); scene.fog = new THREE.FogExp2(0x0b1226, 0.008);
const camera = new THREE.PerspectiveCamera(38, 1, 0.05, 400);
camera.position.set(-24, 25, 39);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08; controls.maxPolarAngle = 1.5; controls.minDistance = 1.2; controls.maxDistance = 110;
controls.autoRotateSpeed = 0.55; controls.target.set(0, 0, 4);
const hemi = new THREE.HemisphereLight(0xffffff, 0x8a8f9a, 0.9); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 0.7); scene.add(sun);

const sea = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), new THREE.MeshLambertMaterial({ color: 0x1b3a5c }));
sea.rotation.x = -Math.PI / 2; sea.position.y = -0.02; scene.add(sea);
// land = pincode polygons
const lands = [];
const shapesOf = g => (g.type === 'Polygon' ? [g.coordinates] : g.coordinates).map(rings => {
  const sh = new THREE.Shape(rings[0].map(c => new THREE.Vector2(PX(c[0]), -PZ(c[1]))));
  rings.slice(1).forEach(r => sh.holes.push(new THREE.Path(r.map(c => new THREE.Vector2(PX(c[0]), -PZ(c[1])))))); return sh; });
S.pincodes.features.forEach(f => { const g = new THREE.ExtrudeGeometry(shapesOf(f.geometry), { depth: 0.12, bevelEnabled: false }); g.rotateX(-Math.PI / 2); g.computeBoundingBox(); const c = g.boundingBox.getCenter(new THREE.Vector3());
  const m = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ color: 0x777777 })); scene.add(m); lands.push({ m, w: wts(c.x, c.z) }); });
// dumping grounds
const dumpGroup = new THREE.Group(); scene.add(dumpGroup); const dumpLabels = [];
(S.landfills ? S.landfills.features : []).forEach(f => { const g = new THREE.ShapeGeometry(shapesOf(f.geometry)); g.rotateX(-Math.PI / 2);
  const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color: 0x8a5a2b })); m.position.y = 0.16; dumpGroup.add(m);
  if (f.properties.name && f.properties.area_ha > 10) { g.computeBoundingBox(); const c = g.boundingBox.getCenter(new THREE.Vector3()); dumpLabels.push({ pos: new THREE.Vector3(c.x, 0.5, c.z), text: f.properties.name, cls: 'lbl dump', grp: 'dump' }); } });
// towers
const box = new THREE.BoxGeometry(0.64, 1, 0.68); box.translate(0, 0.5, 0);
const towers = new THREE.InstancedMesh(box, new THREE.MeshLambertMaterial({ color: 0xffffff }), NC); scene.add(towers);
// real buildings (3D-GloBFP): oriented boxes, true footprint area and height
let bld = null, BN = 0, BWt = null, BSh = null;
if (window.SAANS_B) { const bin = atob(SAANS_B.d), b = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);
  BN = SAANS_B.n; const ub = new THREE.BoxGeometry(1, 1, 1); ub.translate(0, 0.5, 0);
  bld = new THREE.InstancedMesh(ub, new THREE.MeshLambertMaterial({ color: 0xffffff }), BN); BWt = new Float32Array(BN * 4); BSh = new Float32Array(BN);
  const q = new THREE.Quaternion(), yAx = new THREE.Vector3(0, 1, 0), pos = new THREE.Vector3(), sc = new THREE.Vector3(), m4 = new THREE.Matrix4();
  for (let i = 0, o = 0; i < BN; i++, o += 8) { const x = (b[o] | b[o + 1] << 8) / 65535 * 28 - 14, z = -((b[o + 2] | b[o + 3] << 8) / 65535 * 48 - 24);
    q.setFromAxisAngle(yAx, b[o + 6] / 255 * Math.PI); pos.set(x, 0.12, z); sc.set(b[o + 4] * 0.002, b[o + 7] / 1000 * VEX, b[o + 5] * 0.002);
    bld.setMatrixAt(i, m4.compose(pos, q, sc)); const w = wts(x, z); BWt.set(w, i * 4); BSh[i] = 0.8 + 0.2 * ((i * 2654435761 >>> 0) % 1000) / 1000; }
  bld.setColorAt(0, new THREE.Color(1, 1, 1)); bld.frustumCulled = false; scene.add(bld); }
function pmRGB(v, arr, o, s) { let i = 1; while (i < 5 && v > ANCH[i][0]) i++; const a = ANCH[i - 1], c = ANCH[i], f = Math.min(1, Math.max(0, (v - a[0]) / (c[0] - a[0])));

const SPEED = 1.3;   // forecast hours per second

/* ---------- frame ---------- */

addEventListener('resize', resize); resize(); applyLang(); syncBtns(); document.body.dataset.ready = '1'; if (QP.get('debug')) setTimeout(() => { document.title = 'W' + document.documentElement.scrollWidth; }, 2500); requestAnimationFrame(frame);
